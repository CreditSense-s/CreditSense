# Activated with SPRING_PROFILES_ACTIVE=prod (see docker-compose.prod.yml).
# ProductionSafetyCheck refuses to start this profile with the development secrets.

creditsense:
  access:
    password-login-enabled: ${PASSWORD_LOGIN_ENABLED:false}
  seed:
    enabled: ${SEED_DEMO_DATA:false}
  auth:
    refresh-cookie:
      secure: ${AUTH_COOKIE_SECURE:true}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

server:
  error:
    include-message: always
    include-stacktrace: never
