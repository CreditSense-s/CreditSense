# Included in every location that sets its own headers: nginx drops server-level
# add_header directives in any location that has add_header of its own.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Fonts are bundled and the API is same-origin; inline styles are needed for chart geometry only.
# accounts.google.com/gsi is allowed for the "Sign in with Google" button (script, its iframe and its styles).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https://*.googleusercontent.com; font-src 'self'; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Lets Google's sign-in popup hand its result back to the page.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
