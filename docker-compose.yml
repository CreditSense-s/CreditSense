services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creditsense
      POSTGRES_USER: creditsense
      POSTGRES_PASSWORD: creditsense
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditsense -d creditsense"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports: ["5432:5432"]

  ml-service:
    build: ./ml-service
    environment:
      MODEL_DIR: /app/models
      DATA_DIR: /app/data
    volumes:
      - ml-data:/app/data
      - ml-models:/app/models
    ports: ["8000:8000"]

  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/creditsense
      SPRING_DATASOURCE_USERNAME: creditsense
      SPRING_DATASOURCE_PASSWORD: creditsense
      ML_SERVICE_URL: http://ml-service:8000
      JWT_SECRET: change-this-demo-secret-to-a-32-byte-minimum-value
      # Local demo only: seeds the published demo accounts and enables password sign-in.
      APP_DEMO_MODE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    ports: ["8080:8080"]

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["5173:80"]

volumes:
  postgres-data:
  ml-data:
  ml-models:
